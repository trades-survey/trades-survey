name: Mise à jour et publication

on:
  schedule:
    - cron: "0 5 * * 1"   # chaque lundi à 5 h UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "site/**", "tests/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Mentions légales (variables du dépôt, pas des secrets : elles sont publiées sur le site).
      EDITEUR_NOM: ${{ vars.EDITEUR_NOM }}
      EDITEUR_CONTACT: ${{ vars.EDITEUR_CONTACT }}
      HEBERGEUR: ${{ vars.HEBERGEUR }}
      EDITEUR_ANONYME: ${{ vars.EDITEUR_ANONYME }}
      SITE_URL: ${{ vars.SITE_URL }}
      # Référencement (facultatif) : vérification Google Search Console et Bing Webmaster Tools, clé IndexNow
      GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
      INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Télécharger l'open data HATVP
        run: bash scripts/fetch_hatvp.sh
      # Groupes politiques (open data Assemblée nationale et Sénat) : facultatif, le site se construit sans
      - name: Télécharger les groupes politiques
        run: python3 -I scripts/fetch_groupes.py || echo "::warning::groupes politiques indisponibles cette semaine"
      # Liste officielle Euronext pour vérifier les ISIN : facultative, le site se construit sans
      - name: Télécharger la liste Euronext
        run: python3 -I scripts/fetch_euronext.py || echo "::warning::liste Euronext indisponible cette semaine"
      # Croisements (site/croisements.py) : chaque source est facultative, le site se construit sans
      - name: Télécharger le répertoire des représentants d'intérêts
        run: python3 -I scripts/fetch_lobbying.py || echo "::warning::répertoire HATVP indisponible cette semaine"
      - name: Télécharger amendements et scrutins de l'Assemblée
        run: python3 -I scripts/fetch_assemblee.py || echo "::warning::données de l'Assemblée indisponibles cette semaine"
      - name: Télécharger les marchés publics
        run: python3 -I scripts/fetch_decp.py || echo "::warning::commande publique indisponible cette semaine"
      - name: Lire les décrets de déport au Journal officiel
        run: python3 -I scripts/fetch_deports.py || echo "::warning::Journal officiel indisponible cette semaine"
      - name: Extraire participations et mouvements
        run: |
          python3 -I scripts/extract_participations.py data/raw/declarations.xml --liste data/raw/liste.csv \
            --ministres-patrimoine --declarations-out data/out/declarations.csv --conjoints-out data/out/conjoints.csv \
            --activites-out data/out/activites.csv \
            -o data/out/participations.csv
          python3 -I scripts/compute_mouvements.py data/out/participations.csv data/out/declarations.csv \
            -o data/out/mouvements.csv
      # Recherche les élus de la semaine parmi les dirigeants du RNE (scripts/fetch_rne.py) : facultatif, le site se construit sans
      - name: Rechercher les élus au Registre national des entreprises
        run: python3 -I scripts/fetch_rne.py || echo "::warning::Registre national des entreprises indisponible cette semaine"
      - name: Construire le site
        run: python3 -I site/build.py
      # Bloque le workflow si le site construit n'est pas conforme (voir docs/CONFORMITE.md).
      - name: Contrôler la conformité (RGPD, transparence, mentions)
        run: |
          python3 -I tests/test_conformite.py
          python3 -I site/check_conformite.py
      - name: Archiver les données de la semaine
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/out data/ref/deports.json data/ref/pages.json
          git diff --cached --quiet || git commit -m "Données HATVP du $(date -u +%F)"
          git push
      # Avant toute mise en ligne, les mentions légales doivent être complètes.
      - name: Contrôler les mentions avant publication
        if: github.event_name != 'push' && env.EDITEUR_CONTACT != ''
        run: python3 -I site/check_conformite.py --publication
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  # Mise en ligne sur GitHub Pages, seulement quand les mentions légales sont renseignées
  # (variable de dépôt EDITEUR_CONTACT) et jamais sur un simple push de code.
  deploy:
    needs: build
    if: github.event_name != 'push' && vars.EDITEUR_CONTACT != ''
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # Signale aux moteurs qui suivent IndexNow (Bing, et par lui les assistants qui s'en servent ; Yandex…)
      # les pages dont le contenu a changé cette semaine (date du sitemap = date de la mise à jour). Facultatif.
      - name: Signaler les pages modifiées (IndexNow)
        if: vars.INDEXNOW_KEY != ''
        env:
          KEY: ${{ vars.INDEXNOW_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          site="${SITE_URL:-https://trades-survey.github.io/trades-survey/}"; site="${site%/}/"
          curl -fsS "${site}sitemap.xml" | grep -o "<loc>[^<]*</loc><lastmod>$(date -u +%F)</lastmod>" \
            | sed 's#<loc>\([^<]*\)</loc>.*#\1#' | head -n 10000 > urls.txt || true
          echo "$(wc -l < urls.txt) pages modifiées"
          [ -s urls.txt ] || exit 0
          jq -Rn --arg h "$(echo "$site" | cut -d/ -f3)" --arg k "$KEY" --arg l "${site}${KEY}.txt" \
            '{host:$h,key:$k,keyLocation:$l,urlList:[inputs]}' < urls.txt \
            | curl -sS -o /dev/null -w 'IndexNow : HTTP %{http_code}\n' -X POST -H 'Content-Type: application/json; charset=utf-8' \
              --data @- https://api.indexnow.org/indexnow || echo "::warning::IndexNow indisponible"
