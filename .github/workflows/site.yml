name: Mise à jour et publication

on:
  schedule:
    - cron: "0 5 * * 1"   # chaque lundi à 5 h UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "site/**", "tests/**", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      # Mentions légales (variables du dépôt, pas des secrets : elles sont publiées sur le site).
      EDITEUR_NOM: ${{ vars.EDITEUR_NOM }}
      EDITEUR_CONTACT: ${{ vars.EDITEUR_CONTACT }}
      HEBERGEUR: ${{ vars.HEBERGEUR }}
      EDITEUR_ANONYME: ${{ vars.EDITEUR_ANONYME }}
      SOUTENIR_URL: ${{ vars.SOUTENIR_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Télécharger l'open data HATVP
        run: bash scripts/fetch_hatvp.sh
      - name: Extraire participations et mouvements
        run: |
          python3 -I scripts/extract_participations.py data/raw/declarations.xml --liste data/raw/liste.csv \
            --ministres-patrimoine --declarations-out data/out/declarations.csv -o data/out/participations.csv
          python3 -I scripts/compute_mouvements.py data/out/participations.csv data/out/declarations.csv \
            -o data/out/mouvements.csv
      - name: Construire le site
        run: python3 -I site/build.py
      # Bloque le workflow si le site construit n'est pas conforme (voir docs/CONFORMITE.md).
      - name: Contrôler la conformité (RGPD, transparence, mentions)
        run: |
          python3 -I tests/test_conformite.py
          python3 -I site/check_conformite.py
      - name: Archiver les données de la semaine
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/out
          git diff --cached --quiet || git commit -m "Données HATVP du $(date -u +%F)"
          git push
      # Envoi sur o2switch (FTP chiffré), uniquement quand les trois secrets FTP existent.
      # Le compte FTP doit pointer sur le dossier du domaine : son contenu est remplacé par public/.
      - name: Publier sur o2switch
        if: env.FTP_SERVER != '' && github.event_name != 'push'
        run: |
          python3 -I site/check_conformite.py --publication
          sudo apt-get install -y -qq lftp
          lftp -u "$FTP_USER,$FTP_PASSWORD" "ftp://$FTP_SERVER" \
            -e "set ftp:ssl-force true; set ssl:verify-certificate yes; mirror -R --delete --verbose public/ ./; bye"
