name: Sonde temporaire des sources
on:
  push:
    branches: [claude/project-thread-up8zjt]
    paths: [".github/workflows/sonde.yml"]
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - name: Sonder
        run: |
          set +e
          p(){ echo "== $1 -> $(curl -sSL --compressed -m 90 -A 'Mozilla/5.0' -o /tmp/o -w '%{http_code} %{size_download} %{url_effective}' "$1")"; }
          p "https://data.economie.gouv.fr/api/explore/v2.1/catalog/datasets/decp-v3-marches-valides/records?limit=2"; head -c 5000 /tmp/o; echo
          p "https://data.economie.gouv.fr/api/explore/v2.1/catalog/datasets/decp-v3-marches-valides"; head -c 3000 /tmp/o; echo
          p "https://data.economie.gouv.fr/api/explore/v2.1/catalog/datasets?where=search(%22decp%22)&limit=20"; python3 -c "
          import json; d=json.load(open('/tmp/o'))
          for x in d.get('results',[]): print(x['dataset_id'], x.get('metas',{}).get('default',{}).get('records_count'), x.get('metas',{}).get('default',{}).get('modified'))"
          p "https://www.assemblee-nationale.fr/dyn/deontologie"; grep -oiE '.{0,200}(registre|d[ée]port).{0,200}' /tmp/o | head -20
          p "https://www.assemblee-nationale.fr/dyn/17/amendements/0772/CION-ECO/CE198"
          p "https://www.assemblee-nationale.fr/dyn/17/scrutins/156"
          p "https://echanges.dila.gouv.fr/OPENDATA/JORF/"; grep -oE 'JORF_2026[0-9-]+\.tar\.gz' /tmp/o | sort -u | tail -3; f=$(grep -oE 'JORF_2026[0-9-]+\.tar\.gz' /tmp/o | sort -u | tail -40 | head -1)
          for f in $(grep -oE 'JORF_2026[0-9-]+\.tar\.gz' /tmp/o | sort -u | tail -60); do curl -sS -m 60 -o /tmp/j.tgz "https://echanges.dila.gouv.fr/OPENDATA/JORF/$f"; mkdir -p /tmp/j; tar -xzf /tmp/j.tgz -C /tmp/j 2>/dev/null; done
          du -sh /tmp/j; find /tmp/j -type f | head -5; find /tmp/j -type f | wc -l
          grep -rl "59-178" /tmp/j | head -5
          for x in $(grep -rl "article 2-1 du décret n° 59-178" /tmp/j | head -3); do echo "---- $x"; head -c 6000 "$x"; echo; done
          grep -rlE "d[ée]port" /tmp/j | head -5
